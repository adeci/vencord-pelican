<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelican desktop integration fixture</title>
    <style>
      /* Representative fixture palette, not Discord's live theme. */
      :root {
        --font-primary: system-ui;
        --text-default: #f1f3f8;
        --text-normal: #f1f3f8;
        --text-muted: #b5bac1;
        --text-link: #8ab4ff;
        --control-primary-background-default: #5865f2;
        --control-primary-background-hover: #4752c4;
        --control-primary-border-default: transparent;
        --control-primary-border-hover: transparent;
        --control-primary-text-default: white;
        --control-primary-text-hover: white;
        --control-secondary-background-default: #393c43;
        --control-secondary-background-hover: #44474e;
        --control-secondary-border-default: #555963;
        --control-secondary-border-hover: #686d78;
        --control-secondary-text-default: #f1f3f8;
        --control-secondary-text-hover: white;
        --control-critical-secondary-background-default: #432c30;
        --control-critical-secondary-background-hover: #593137;
        --control-critical-secondary-border-default: #99525c;
        --control-critical-secondary-border-hover: #bd6873;
        --control-critical-secondary-text-default: #ff929b;
        --control-critical-secondary-text-hover: #ffb0b6;
      }
      body {
        background: #20232b;
        color: #f1f3f8;
        font: 16px system-ui;
        margin: 0;
      }
      main {
        max-width: 1050px;
        margin: 24px auto;
        padding: 20px;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button:not([data-mana-component="button"]) {
        padding: 10px 16px;
        margin: 5px;
        border: 1px solid #8994ab;
        border-radius: 5px;
        background: #39465f;
        color: white;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 160px;
        padding: 12px;
        background: #131720;
        color: white;
        border: 2px solid #8994ab;
        border-radius: 5px;
      }
      label {
        display: block;
        padding: 15px 0;
      }
      details,
      section {
        padding: 12px;
        background: #292f3b;
        margin-top: 12px;
      }
      pre {
        white-space: pre-wrap;
      }
      p {
        line-height: 1.4;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: #0009;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .overlay section {
        max-width: 720px;
        max-height: 85vh;
        overflow: auto;
        padding: 24px;
        box-shadow: 0 10px 50px #000;
      }
      input[type="password"] {
        width: 90%;
        padding: 8px;
      }
    </style>
    <link rel="stylesheet" href="/fixture.css" />
  </head>
  <body>
    <div id="root">Waiting for the real packaged Vesktop preload…</div>
    <script src="/fixture.js"></script>
  </body>
</html>
